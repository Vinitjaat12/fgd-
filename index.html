<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060608">
<title>NEXUS BHAI · Private Invite</title>



<style>
:root{
  --bg:#060608;--paper:#f6f3ec;--ink:#0b0b0f;--muted:#77736b;--rule:#d9d3c7;--ok:#1f9d55;
  --holo:linear-gradient(90deg,#ff9ad5 0%,#b3a9ff 20%,#7ff2e6 40%,#f9f6a6 60%,#ffb38a 80%,#ff9ad5 100%);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --stub:96px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:'Syne',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;cursor:pointer;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  background:
    radial-gradient(80% 46% at 50% -8%,rgba(255,255,255,.15) 0%,rgba(255,255,255,0) 70%),
    var(--bg);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:30;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* light beams + drifting colour */
.beams{position:fixed;left:50%;top:-10%;width:180vw;max-width:900px;height:75vh;transform:translateX(-50%);pointer-events:none;opacity:.5;
  background:conic-gradient(from 180deg at 50% 0%,rgba(255,255,255,0) 160deg,rgba(255,255,255,.10) 172deg,rgba(255,255,255,0) 178deg,rgba(255,255,255,.08) 186deg,rgba(255,255,255,0) 194deg,rgba(255,255,255,.07) 200deg,rgba(255,255,255,0) 210deg);
  -webkit-mask:linear-gradient(180deg,#000 0%,transparent 90%);mask:linear-gradient(180deg,#000 0%,transparent 90%);animation:beams 9s ease-in-out infinite}
.glow{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(72px);opacity:.42;pointer-events:none}
.g1{background:#ff7ac8;left:-110px;top:30%;animation:drift1 9s ease-in-out infinite}
.g2{background:#5ff0dc;right:-120px;top:16%;animation:drift2 11s ease-in-out infinite}
.g3{background:#f6e27a;left:25%;bottom:-180px;opacity:.24;animation:drift1 13s ease-in-out infinite reverse}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

.page{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,.78);
  opacity:0;animation:fade .7s .05s ease forwards}
.eyebrow i{width:22px;height:1px;background:rgba(255,255,255,.35)}
.spark{width:12px;height:12px;color:#f9f6a6;animation:twinkle 2.2s ease-in-out infinite}
.spark+.spark{animation-delay:1.1s}

/* ticket */
.stage{width:100%;max-width:372px;display:flex;align-items:center;padding:22px 0 26px;perspective:1100px}
.drop{width:100%;filter:drop-shadow(0 34px 44px rgba(0,0,0,.6)) drop-shadow(0 0 46px rgba(179,169,255,.22));opacity:0;
  animation:deal 1.05s .12s cubic-bezier(.2,1.05,.3,1) forwards}
.ticket{position:relative;display:block;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:26px;overflow:hidden;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform;
  -webkit-mask:radial-gradient(circle 15px at 0 calc(100% - var(--stub)),transparent 97%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% calc(100% - var(--stub)),transparent 97%,#000 100%) right/51% 100% no-repeat;
  mask:radial-gradient(circle 15px at 0 calc(100% - var(--stub)),transparent 97%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% calc(100% - var(--stub)),transparent 97%,#000 100%) right/51% 100% no-repeat}
.band{height:13px;background:var(--holo);background-size:200% 100%;animation:holo 5s linear infinite}

/* holographic layers: foil sweep, rainbow glare spot, gloss */
.foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;z-index:3;
  background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,154,213,.55) 42%,rgba(127,242,230,.55) 50%,rgba(249,246,166,.6) 58%,rgba(255,255,255,0) 68%);
  background-size:260% 100%;background-position:var(--fx,50%) 0}
.prism{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:multiply;opacity:.7;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,0) 0 7px,rgba(179,169,255,.35) 7px 8px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,0) 0 7px,rgba(127,242,230,.35) 7px 8px),
    radial-gradient(circle at var(--mx,50%) var(--my,35%),rgba(255,154,213,.55) 0%,rgba(249,246,166,.45) 18%,rgba(127,242,230,.4) 30%,rgba(255,255,255,0) 46%);
  -webkit-mask:radial-gradient(circle at var(--mx,50%) var(--my,35%),#000 0%,rgba(0,0,0,.5) 28%,transparent 50%);
  mask:radial-gradient(circle at var(--mx,50%) var(--my,35%),#000 0%,rgba(0,0,0,.5) 28%,transparent 50%)}
.gloss{position:absolute;inset:0;pointer-events:none;z-index:4;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;
  animation:gloss 4.5s ease-in-out 1.3s infinite}

.t-body{position:relative;padding:16px 20px 18px;text-align:center}
.t-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.t-head span{display:inline-flex;align-items:center;gap:6px}
.t-head svg{width:14px;height:14px}

.av{position:relative;width:104px;height:104px;margin:16px auto 0;border-radius:30px;padding:3px;background:var(--holo);background-size:200% 100%;animation:holo 4s linear infinite;
  box-shadow:0 10px 26px -8px rgba(179,169,255,.7)}
.avatar{width:100%;height:100%;border-radius:27px;background-color:#ddd7cb;border:3px solid var(--paper)}
.tick{position:absolute;right:-9px;bottom:-9px;width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.tick svg{width:24px;height:24px}

.name{margin-top:14px;font-size:clamp(30px,9.6vw,40px);line-height:1.02;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;overflow-wrap:normal;word-break:normal;color:var(--ink)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .name{background:linear-gradient(100deg,#0b0b0f 0%,#0b0b0f 40%,#6b3fd1 47%,#0f9f98 53%,#0b0b0f 60%,#0b0b0f 100%);background-size:320% 100%;background-position:130% 0;animation:inkfoil 5s ease-in-out 1.2s infinite;
    -webkit-background-clip:text;background-clip:text;color:transparent}
}
.role{margin-top:7px;font-size:14.5px;font-weight:600;color:var(--muted)}

.meta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.meta div{padding:10px 4px;text-align:center}
.meta div+div{border-left:1px solid var(--rule)}
.meta small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.meta b{display:block;margin-top:4px;font-size:14px;font-weight:700;letter-spacing:.02em;white-space:nowrap}

.t-stub{position:relative;height:var(--stub);border-top:2px dashed var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px}
.bars{width:150px;height:36px;color:var(--ink);flex:none}
.stub-r{text-align:right;font-family:var(--mono)}
.stub-r small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.stub-r b{display:block;margin-top:3px;font-size:17px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* rubber stamp on accept */
.stamp{position:absolute;left:50%;top:44%;z-index:5;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:3.5px solid var(--ok);border-radius:12px;color:var(--ok);
  font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.14em;background:rgba(246,243,236,.85)}
.stamp svg{width:22px;height:22px}
.accepted .stamp{animation:stamp .38s cubic-bezier(.3,1.6,.5,1) forwards}
.accepted .stage{animation:thud .38s .05s ease-out}

/* CTA */
.cta{position:relative;width:100%;max-width:372px;opacity:0;animation:fade .7s .75s ease forwards}
#joinBtn{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:66px;border-radius:999px;overflow:hidden;text-decoration:none;color:#0b0b0f;
  background:var(--holo);background-size:200% 100%;animation:holo 5s linear infinite,glowpulse 2.4s ease-in-out 1.6s infinite;
  box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 14px 34px -10px rgba(255,154,213,.6);transition:transform .15s}
#joinBtn:active{transform:scale(.96)}
#joinBtn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0));animation:shine 2.8s ease-in-out 1.2s infinite}
.ring{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.6);pointer-events:none;opacity:0;animation:ring 2.4s ease-out 1.8s infinite}
.lbl{font-size:20px;font-weight:800;letter-spacing:-.005em;white-space:nowrap}
.accepted .lbl{font-size:17px}
.go{width:40px;height:40px;border-radius:50%;background:#0b0b0f;color:#fff;display:grid;place-items:center;flex:none}
.go svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
.hand{position:absolute;right:20px;top:42px;font-size:30px;line-height:1;pointer-events:none;opacity:0;transform-origin:50% 0;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.hint .hand{animation:tap 1.3s ease-in-out infinite}
.note{margin-top:13px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;color:rgba(255,255,255,.58)}
.note b{color:#7ff2e6;font-weight:700}

@keyframes inkfoil{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes deal{0%{opacity:0;transform:translateY(90px) rotate(-7deg) scale(.86)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes holo{to{background-position:200% 0}}
@keyframes gloss{0%{background-position:120% 0}50%,100%{background-position:-60% 0}}
@keyframes shine{0%{left:-40%}60%,100%{left:130%}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes tap{0%,100%{opacity:1;transform:translateY(0) rotate(-12deg)}50%{opacity:1;transform:translateY(-10px) rotate(-12deg)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 14px 34px -10px rgba(255,154,213,.6)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 18px 48px -6px rgba(127,242,230,.75)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(45deg);opacity:.6}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,30px)}}
@keyframes beams{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}70%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
@keyframes thud{0%{transform:none}40%{transform:translateY(3px) scale(.985)}100%{transform:none}}
@media (max-height:740px){
  :root{--stub:84px}
  .stage{padding:14px 0 18px}.av{width:84px;height:84px;margin-top:12px;border-radius:24px}.avatar{border-radius:21px}
  .name{font-size:clamp(28px,8.6vw,34px);margin-top:10px}.meta{margin-top:12px}.meta div{padding:8px 4px}
  #joinBtn{height:60px}.note{margin-top:10px}
}
@media (min-height:860px){.av{width:116px;height:116px;border-radius:32px}.avatar{border-radius:29px}.t-body{padding:18px 22px 20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
